<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPARK Overlay</title>
<style>
:root{
  --spark-amber:#ffb617;
  --spark-gold:#ffd000;
  --blue:#1b8cff;
  --orange:#ff8400;
  --overlay-text:#f7f7f4;
  --overlay-accent:#ffd000;
  --overlay-boost-blue:#1b8cff;
  --overlay-boost-blue-end:#80eeff;
  --overlay-boost-orange:#ff8400;
  --overlay-font:Inter,Segoe UI,Arial,sans-serif;
  --panel:#050609;
  --text:#f7f7f4;
  --stage-scale:1;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  color:var(--overlay-text);
  font-family:var(--overlay-font);
}
.stage{
  position:relative;
  width:1920px;
  height:1080px;
  transform:scale(var(--stage-scale));
  transform-origin:top left;
}
.tournamentLogo{
  position:absolute;
  left:var(--logo-x,820px);
  top:var(--logo-y,146px);
  width:var(--logo-w,280px);
  height:auto;
  display:none;
  z-index:4;
  object-fit:contain;
  object-position:center;
  pointer-events:none;
  filter:drop-shadow(0 5px 10px rgba(0,0,0,.48));
}
.stage.hasTournamentLogo .tournamentLogo{display:block}
.customScoreboardSkin,
.customScoreboardLayer{
  display:none;
}
.customScoreboardSkin{
  position:absolute;
  inset:0;
  width:1920px;
  height:1080px;
  object-fit:contain;
  object-position:top center;
  z-index:1;
  pointer-events:none;
}
.customScoreboardLayer{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
}
.stage.customScoreboard .scorebug{
  display:none;
}
.stage.customScoreboard .customScoreboardSkin,
.stage.customScoreboard .customScoreboardLayer{
  display:block;
}
.maskSlot{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:1px;
  min-height:1px;
  color:#f7f7f4;
  font-weight:1000;
  line-height:1;
  text-align:center;
  text-transform:uppercase;
  text-shadow:0 3px 7px rgba(0,0,0,.65);
  overflow:hidden;
}
.maskSlot.logo img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  filter:drop-shadow(0 4px 7px rgba(0,0,0,.55));
}
.maskSlot.logo.empty{
  display:none !important;
}
.maskSlot.score{
  font-family:var(--mask-goal-font,var(--overlay-font));
  font-size:calc(var(--slot-font,52px) * var(--mask-goal-scale,1));
  color:var(--mask-goal-color,#fffdf3);
  transform:translateY(-.045em);
}
.maskSlot.clock{
  isolation:isolate;
  font-family:var(--mask-timer-font,var(--overlay-font));
  font-size:calc(var(--slot-font,44px) * var(--mask-timer-scale,1));
  color:var(--mask-timer-color,#fffdf3);
  letter-spacing:.02em;
}
.maskSlot.clock::before{
  content:"";
  position:absolute;
  inset:-8px;
  z-index:-1;
  border-radius:999px;
  background:rgba(80,0,0,.95);
  box-shadow:0 0 18px rgba(128,0,0,.62), inset 0 0 18px rgba(255,72,48,.16);
  opacity:0;
  filter:blur(2px);
  transition:opacity .18s cubic-bezier(.22,1,.36,1);
}
.stage.overtime .maskSlot.clock::before{opacity:1}
.maskSlot.teamName{
  padding:0 12px;
  font-family:var(--mask-team-font,var(--overlay-font));
  font-size:calc(var(--slot-font,26px) * var(--mask-team-scale,1));
  color:var(--mask-team-color,#f7f7f4);
  letter-spacing:.03em;
  white-space:nowrap;
  text-overflow:ellipsis;
  transform:translateY(-.045em);
}
.maskSlot.seriesTitle{
  font-family:var(--mask-ticker-font,var(--overlay-font));
  font-size:calc(var(--slot-font,22px) * var(--mask-ticker-scale,1));
  letter-spacing:.08em;
  color:var(--mask-ticker-color,#050609);
  text-shadow:none;
  white-space:pre;
  overflow:hidden;
  transform:translateY(.08em);
}
.maskSlot.seriesTitle .tickerTrack{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}
.maskSlot.seriesTitle .tickerCopy{
  position:absolute;
  left:0;
  top:50%;
  white-space:pre;
  transform:translate3d(var(--ticker-x,0px),-50%,0);
  will-change:transform;
}
.maskSlot.seriesDots{
  gap:5px;
  justify-content:center;
}
.maskSlot.seriesDots .dot{
  width:clamp(8px,18%,18px);
  height:clamp(6px,60%,14px);
}
.scorebug{
  position:absolute;
  left:50%;
  top:0;
  width:min(1180px,86vw);
  height:156px;
  transform:translateX(-50%);
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.45));
}
.wing{
  position:absolute;
  top:20px;
  width:43%;
  height:58px;
  background:linear-gradient(180deg,#ffc938,#f1a70e);
  color:var(--mask-team-color,#fff);
  display:flex;
  align-items:center;
  font-family:var(--mask-team-font,var(--overlay-font));
  font-size:calc(24px * var(--mask-team-scale,1));
  font-weight:900;
  letter-spacing:.04em;
  text-transform:uppercase;
  text-shadow:0 2px 0 rgba(0,0,0,.18);
  gap:14px;
  overflow:hidden;
}
.wing.left{
  left:0;
  justify-content:flex-end;
  padding-left:24px;
  padding-right:118px;
  clip-path:polygon(0 0,100% 0,84% 100%,0 100%);
}
.wing.right{
  right:0;
  justify-content:flex-start;
  padding-right:24px;
  padding-left:118px;
  clip-path:polygon(0 0,100% 0,100% 100%,16% 100%);
}
.teamLogo{
  width:68px;
  height:42px;
  flex:0 0 68px;
  object-fit:contain;
  object-position:center;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.55));
}
.teamLogo.empty{
  display:none;
}
.teamLabel{
  min-width:0;
  flex:0 1 auto;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.center{
  position:absolute;
  left:50%;
  top:0;
  width:344px;
  height:132px;
  transform:translateX(-50%);
  background:#07080b;
  clip-path:polygon(8% 0,92% 0,100% 64%,70% 100%,30% 100%,0 64%);
  display:grid;
  grid-template-columns:72px 1fr 72px;
  grid-template-rows:70px 28px 34px;
  align-items:center;
  justify-items:center;
  border-bottom:2px solid rgba(255,255,255,.55);
}
.score{
  width:72px;
  height:70px;
  display:grid;
  place-items:center;
  font-family:var(--mask-goal-font,var(--overlay-font));
  font-size:calc(42px * var(--mask-goal-scale,1));
  font-weight:900;
  color:var(--mask-goal-color,#fff);
}
.score.blue{
  background:var(--blue);
  padding-left:12px;
}
.score.orange{
  background:var(--orange);
  padding-right:12px;
}
.clock{
  grid-column:2;
  position:relative;
  isolation:isolate;
  font-family:var(--mask-timer-font,var(--overlay-font));
  font-size:calc(36px * var(--mask-timer-scale,1));
  font-weight:950;
  line-height:1;
  color:var(--mask-timer-color,#fffdf3);
}
.clock::before{
  content:"";
  position:absolute;
  inset:-11px -18px;
  z-index:-1;
  border-radius:999px;
  background:rgba(80,0,0,.95);
  box-shadow:0 0 20px rgba(128,0,0,.68), inset 0 0 18px rgba(255,72,48,.18);
  opacity:0;
  filter:blur(2px);
  transition:opacity .18s cubic-bezier(.22,1,.36,1);
}
.stage.overtime .clock::before{opacity:1}
.match{
  grid-column:1/4;
  grid-row:2;
  font-family:var(--mask-ticker-font,var(--overlay-font));
  font-size:calc(13px * var(--mask-ticker-scale,1));
  font-weight:800;
  color:var(--mask-ticker-color,#ddd);
}
.bolt{
  grid-column:2;
  grid-row:3;
  height:42px;
  transform:translateY(3px);
}
.series{
  position:absolute;
  top:78px;
  width:220px;
  height:36px;
  background:#fff;
  display:flex;
  align-items:center;
  gap:10px;
}
.series.left{
  right:50%;
  margin-right:156px;
  justify-content:flex-end;
  padding-right:34px;
  clip-path:polygon(20% 0,100% 0,86% 100%,0 100%);
}
.series.right{
  left:50%;
  margin-left:156px;
  justify-content:flex-start;
  padding-left:34px;
  clip-path:polygon(0 0,80% 0,100% 100%,14% 100%);
}
.dot{
  width:18px;
  height:18px;
  border-radius:4px;
  background:#08090d;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);
}
.dot.blue.filled{background:var(--blue)}
.dot.orange.filled{background:var(--orange)}
.boosts{
  position:absolute;
  top:142px;
  width:243px;
  display:flex;
  flex-direction:column;
  gap:5px;
}
.boosts.left{left:30px}
.boosts.right{right:30px}
.boostRow{
  --boostTeam:var(--overlay-boost-blue);
  --boostEnd:var(--overlay-boost-blue-end);
  position:relative;
  height:22px;
  background:linear-gradient(180deg,rgba(9,11,16,.94),rgba(3,4,7,.98));
  border:1px solid color-mix(in srgb,var(--boostTeam) 45%,rgba(255,255,255,.2));
  display:grid;
  grid-template-columns:minmax(0,1fr);
  align-items:center;
  font-family:var(--boost-font,var(--overlay-font));
  font-size:calc(12px * var(--boost-font-scale,1));
  font-weight:850;
  text-transform:uppercase;
  overflow:hidden;
  box-shadow:0 5px 12px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.12);
  border-radius:4px;
}
.boosts.right .boostRow{
  --boostTeam:var(--overlay-boost-orange);
  --boostEnd:var(--overlay-accent);
  text-align:right;
}
.bar{
  position:absolute;
  inset:0 auto 0 0;
  height:100%;
  width:var(--boost,0%);
  background:
    linear-gradient(90deg,color-mix(in srgb,var(--boostTeam) 90%,#fff 6%),var(--boostEnd)),
    linear-gradient(180deg,rgba(255,255,255,.28),transparent);
  opacity:.78;
  box-shadow:0 0 16px color-mix(in srgb,var(--boostTeam) 72%,transparent);
  transform-origin:left;
  transition:width .22s cubic-bezier(.22,1,.36,1);
  will-change:width;
}
.boosts.right .bar{
  inset:0 0 0 auto;
  transform-origin:right;
}
.name{position:relative;padding:0 9px;z-index:1;color:var(--boost-text-color,var(--overlay-text))}
.replay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:86px;
  padding:14px 470px 0;
  background:
    linear-gradient(90deg,transparent 0 28%,rgba(255,208,0,.92) 28% 72%,transparent 72% 100%),
    linear-gradient(180deg,transparent,rgba(5,6,9,.82) 42%,rgba(5,6,9,.96));
  color:#fffdf3;
  font-weight:950;
  text-transform:uppercase;
  text-align:center;
  text-shadow:0 3px 8px rgba(0,0,0,.75);
  display:none;
  clip-path:polygon(0 40%,34% 40%,39% 0,61% 0,66% 40%,100% 40%,100% 100%,0 100%);
  filter:drop-shadow(0 -7px 18px rgba(0,0,0,.55));
  z-index:6;
}
.replayContent{
  min-width:0;
  display:grid;
  grid-template-rows:28px 23px;
  align-items:center;
  justify-items:center;
  gap:2px;
}
.replayContent.soloTitle{
  grid-template-rows:52px;
}
.replayTitle{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:11px;
  color:#201707;
  font-size:21px;
  font-weight:1000;
  letter-spacing:.2em;
  text-shadow:0 1px rgba(255,255,255,.22),0 2px 8px rgba(255,208,0,.22);
}
.replayTitle::before{
  content:"";
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ff2b2b;
  box-shadow:
    0 0 8px rgba(255,43,43,.95),
    0 0 18px rgba(255,43,43,.72),
    0 0 30px rgba(255,132,0,.34);
}
.replayDetails{
  width:min(100%,760px);
  min-width:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:24px;
  transform:translateY(5px);
}
.replayDetails.triple{
  grid-template-columns:repeat(3,minmax(0,1fr));
}
.replayDetails.solo{
  grid-template-columns:minmax(0,1fr);
  width:min(100%,340px);
}
.replayMeta{
  min-width:0;
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap:8px;
  color:#241903;
  font-size:15px;
  letter-spacing:.035em;
  text-shadow:0 1px rgba(255,255,255,.18),0 2px 7px rgba(255,208,0,.18);
}
.replayMeta b{
  color:#463109;
  font-size:12px;
  letter-spacing:.09em;
  opacity:.76;
}
.replayMeta > span{
  max-width:190px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-weight:1000;
}
.replayMeta.speed{
  align-items:center;
}
.replaySpeedSwap{
  position:relative;
  display:inline-grid;
  min-width:76px;
  height:18px;
  line-height:18px;
  overflow:hidden;
  text-align:left;
  perspective:80px;
  perspective-origin:50% 50%;
}
.replaySpeedValue{
  grid-area:1 / 1;
  display:block;
  font-weight:1000;
  white-space:nowrap;
  backface-visibility:hidden;
  transform-origin:50% 50%;
  transform-style:preserve-3d;
  will-change:opacity,transform;
}
.replaySpeedValue.kph{
  opacity:1;
  transform:rotateX(0deg);
}
.replaySpeedValue.mph{
  opacity:0;
  transform:rotateX(88deg);
}
.replaySpeedSwap.showMph .replaySpeedValue.kph{
  opacity:0;
  transform:rotateX(-88deg);
}
.replaySpeedSwap.showMph .replaySpeedValue.mph{
  opacity:1;
  transform:rotateX(0deg);
}
.replaySpeedSwap.swapping .replaySpeedValue.kph{
  animation:replaySpeedKphOut .68s cubic-bezier(.19,1,.22,1) forwards;
}
.replaySpeedSwap.swapping .replaySpeedValue.mph{
  animation:replaySpeedMphIn .68s cubic-bezier(.19,1,.22,1) forwards;
}
@keyframes replaySpeedKphOut{
  0%{
    opacity:1;
    transform:rotateX(0deg) translateY(0);
  }
  45%{
    opacity:.96;
  }
  100%{
    opacity:0;
    transform:rotateX(-88deg) translateY(-3px);
  }
}
@keyframes replaySpeedMphIn{
  0%{
    opacity:0;
    transform:rotateX(88deg) translateY(3px);
  }
  32%{
    opacity:0;
  }
  100%{
    opacity:1;
    transform:rotateX(0deg) translateY(0);
  }
}
.stage.replayActive .replay{display:block}
.stage.replayActive .boosts,
.stage.replayActive .liveStatCard{
  display:none;
}
.stage:not(.personalOverlay):not(.liveStatsUnlocked) .liveStatCard{
  display:none;
}
.status{
  position:absolute;
  left:50%;
  top:150px;
  transform:translateX(-50%);
  color:rgba(255,255,255,.55);
  font-size:13px;
  font-weight:700;
}
.stage.live .status{display:none}
.personalBadge{
  display:none;
  position:absolute;
  left:18px;
  bottom:16px;
  z-index:29;
  padding:7px 10px;
  border:1px solid rgba(255,208,0,.78);
  background:rgba(5,6,9,.78);
  color:var(--overlay-accent);
  font-size:11px;
  font-weight:950;
  letter-spacing:.08em;
  text-transform:uppercase;
  box-shadow:0 8px 18px rgba(0,0,0,.45),0 0 18px rgba(255,208,0,.18);
  pointer-events:none;
}
.stage.personalOverlay .personalBadge{display:block}
.stage.personalOverlay.live .personalBadge{opacity:.42}
.stage.personalOverlay:not(.live) .personalBadge::after{
  content:"Waiting for live feed";
  display:block;
  margin-top:3px;
  color:rgba(255,255,255,.72);
  font-size:10px;
  letter-spacing:.03em;
}
.liveStatCard{
  position:absolute;
  left:42px;
  bottom:42px;
  width:324px;
  min-height:0;
  padding:8px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.08),transparent 34%),
    rgba(5,6,9,.94);
  border:1px solid rgba(255,208,0,.72);
  box-shadow:0 18px 30px rgba(0,0,0,.48), inset 0 1px rgba(255,255,255,.12);
  display:grid;
  gap:5px;
  overflow:hidden;
}
.liveStatHeader{
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  color:rgba(247,247,244,.72);
  font-size:10px;
  font-weight:950;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.liveStatHeader b{
  color:var(--spark-gold);
  font-size:11px;
}
.liveStatPlayers{
  display:grid;
  gap:4px;
}
.liveStatPlayer{
  --team:var(--spark-gold);
  --statBoostStart:var(--team);
  --statBoostEnd:var(--spark-gold);
  display:grid;
  grid-template-columns:103px repeat(4,41px);
  grid-template-rows:24px 0fr;
  align-items:center;
  column-gap:3px;
  min-height:24px;
  padding:0 5px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.045);
  color:rgba(247,247,244,.84);
  font-size:11px;
  font-weight:850;
  transition:grid-template-rows .22s cubic-bezier(.16,1,.3,1), min-height .22s cubic-bezier(.16,1,.3,1), padding .22s cubic-bezier(.16,1,.3,1), background .18s ease, border-color .18s ease, color .18s ease;
}
.liveStatPlayer.blue{
  --team:var(--blue);
  --statBoostStart:var(--overlay-boost-blue);
  --statBoostEnd:var(--overlay-boost-blue-end);
}
.liveStatPlayer.orange{
  --team:var(--orange);
  --statBoostStart:var(--overlay-boost-orange);
  --statBoostEnd:var(--overlay-accent);
}
.liveStatPlayer.focused{
  grid-template-rows:29px 10px;
  min-height:41px;
  padding:2px 7px 5px;
  border-color:color-mix(in srgb,var(--team) 74%,#f7f7f4);
  background:linear-gradient(90deg,color-mix(in srgb,var(--team) 26%,transparent),rgba(255,255,255,.06));
  color:#fffdf3;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
}
.liveStatName{
  min-width:0;
  max-width:14ch;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:11px;
  font-weight:950;
  color:inherit;
  transition:font-size .22s cubic-bezier(.16,1,.3,1), font-weight .18s ease;
}
.liveStatPlayer.focused .liveStatName{
  font-size:13px;
  font-weight:1000;
}
.liveStatValue{
  display:grid;
  gap:1px;
  justify-items:center;
  line-height:1;
}
.liveStatValue b{
  color:#fffdf3;
  font-size:11px;
  transition:font-size .22s cubic-bezier(.16,1,.3,1), color .18s ease;
}
.liveStatPlayer.focused .liveStatValue b{
  color:var(--spark-gold);
  font-size:13px;
}
.liveStatValue span{
  color:rgba(247,247,244,.54);
  font-size:7px;
  font-weight:950;
  letter-spacing:.02em;
}
.liveStatBoost{
  grid-column:1 / -1;
  grid-row:2;
  align-self:end;
  height:6px;
  overflow:hidden;
  opacity:0;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.12);
  transition:opacity .18s ease;
}
.liveStatPlayer.focused .liveStatBoost{opacity:1}
.liveStatBoost i{
  display:block;
  width:var(--boost,0%);
  height:100%;
  background:linear-gradient(90deg,var(--statBoostStart),var(--statBoostEnd));
  box-shadow:0 0 14px color-mix(in srgb,var(--statBoostStart) 72%,transparent);
  transition:width .22s cubic-bezier(.16,1,.3,1);
}
.stage.finalActive .scorebug,
.stage.finalActive .customScoreboardSkin,
.stage.finalActive .customScoreboardLayer,
.stage.finalActive .boosts,
.stage.finalActive .liveStatCard,
.stage.finalActive .replay,
.stage.finalActive .status{
  display:none;
}
.finalScreen{
  display:none;
  position:absolute;
  inset:0;
  z-index:20;
  color:#f8f3de;
  isolation:isolate;
  box-shadow:inset 0 0 0 9999px oklch(9% .018 92);
  background:
    radial-gradient(circle at 50% 8%,rgba(255,208,0,.28),transparent 25%),
    radial-gradient(circle at 18% 80%,rgba(27,140,255,.14),transparent 32%),
    radial-gradient(circle at 82% 78%,rgba(255,132,0,.16),transparent 34%),
    linear-gradient(135deg,oklch(8.5% .018 92),oklch(15% .024 88) 46%,oklch(7% .016 92));
  overflow:hidden;
}
.finalScreen.active{display:block}
.stage.fadeTransition .finalScreen.active{
  animation:finalFade .18s cubic-bezier(.22,1,.36,1) both;
}
@keyframes finalFade{
  from{opacity:0}
  to{opacity:1}
}
.finalScreen::before{
  content:"";
  position:absolute;

function componentsForColor(data, width, height, target){

        const cy = Math.floor(current / width);

        if(cy < minY) minY = cy;
        if(cy > maxY) maxY = cy;

        rowMax.set(cy, Math.max(rowMax.get(cy) ?? cx, cx));
        const neighbors = [current - 1, current + 1, current - width, current + width];
        for(const next of neighbors){
          if(next < 0 || next >= seen.length || seen[next]) continue;
          if((next === current - 1 && cx === 0) || (next === current + 1 && cx === width - 1)) continue;
          const nextPixel = next * 4;

        let safeMaxX = Infinity;

          safeMinX = Math.max(safeMinX, rowMin.get(row));
          safeMaxX = Math.min(safeMaxX, rowMax.get(row));
        });
        const bboxWidth = maxX - minX + 1;
        if(!Number.isFinite(safeMinX) || !Number.isFinite(safeMaxX) || safeMaxX <= safeMinX || safeMaxX - safeMinX + 1 < bboxWidth * .38){

          safeMaxX = Infinity;

          [(rowMax.get(topRow) + 1 - minX) / bboxWidth * 100, 0],
          [(rowMax.get(bottomRow) + 1 - minX) / bboxWidth * 100, 100],
          [(rowMin.get(bottomRow) - minX) / bboxWidth * 100, 100]
        ].map(point=>`${Math.max(0, Math.min(100, point[0])).toFixed(2)}% ${Math.max(0, Math.min(100, point[1])).toFixed(2)}%`).join(",");

          x:minX * scaleX,
          y:minY * scaleY,

function finalRailStyle(count){

function finalCompareBar(left, right){

  const blue = Math.max(6, Math.round((left / total) * 100));

}

function replaySamplePoint(sample){
  if(!sample || typeof sample !== "object") return null;
  const location = sample.carLocation || sample.location || sample.position || sample;
  const x = Number(firstDefined(location.x, location.X, location.fieldX, location.FieldX));
  const y = Number(firstDefined(location.y, location.Y, location.fieldY, location.FieldY));
  if(!Number.isFinite(x) || !Number.isFinite(y)) return null;
  const elapsed = Number(firstDefined(sample.elapsedSeconds, sample.scoreboardElapsedSeconds, sample.timeSeconds, sample.time));
  return {x, y, elapsed:Number.isFinite(elapsed) ? elapsed : null};
}

function replayHeatmapTeam(player){
  const direct = normalizeTeam(firstDefined(player?.team, player?.Team, player?.teamName, player?.TeamName));
  if(direct) return direct;
  const name = cleanName(player?.name || player?.playerName || player?.id);
  const live = name ? state.players.get(name) : null;
  return live?.team || "Blue";
}

function buildReplayHeatmapFromAnalysis(analysis){
  const players = Array.isArray(analysis?.players) ? analysis.players : [];
  const mapped = players.map(player=>{
    const name = cleanName(firstDefined(player.name, player.playerName, player.id)) || "Player";
    const samples = Array.isArray(player.positionSamples) ? player.positionSamples.map(replaySamplePoint).filter(Boolean) : [];
    return {
      name,
      team:replayHeatmapTeam(player),
      samples
    };
  }).filter(player=>player.samples.length);
  return {
    players:mapped.sort((a,b)=>{
      if(a.team !== b.team) return a.team === "Blue" ? -1 : 1;
      return a.name.localeCompare(b.name);
    }),
    replayFile:analysis?.replayFile || null,
    totalSamples:mapped.reduce((sum, player)=>sum + player.samples.length, 0)
  };
}

const finalHeatmapFieldMap = {
  width:1748,
  height:1147,
  centerX:873.109,
  centerY:572.95,
  scaleX:.134457,
  scaleY:.135245
};
const FINAL_HEAT_BASE_SCALE = 2.85;
const FINAL_HEAT_SCALE_MAX = 8.8;
function clampValue(value, min=0, max=100){
  return Math.max(min, Math.min(max, Number(value) || 0));
}
function clampPercent(value){
  return clampValue(value, 0, 100);
}
function finalImagePixelToMapPercent(x, y){
  return {
    x:clampPercent((Number(x) / finalHeatmapFieldMap.width) * 100),
    y:clampPercent((Number(y) / finalHeatmapFieldMap.height) * 100)
  };
}
function finalFieldCoordToMapPercent(fieldX, fieldY){
  const x = finalHeatmapFieldMap.centerX + Number(fieldY) * finalHeatmapFieldMap.scaleX;
  const y = finalHeatmapFieldMap.centerY - Number(fieldX) * finalHeatmapFieldMap.scaleY;
  return finalImagePixelToMapPercent(x, y);
}
function finalInsetMapPercent(point, insetX=.55, insetY=.55){
  const xScale = Math.max(0, (100 - insetX * 2) / 100);
  const yScale = Math.max(0, (100 - insetY * 2) / 100);
  return {
    x:clampPercent(50 + (Number(point?.x) - 50) * xScale),
    y:clampPercent(50 + (Number(point?.y) - 50) * yScale)
  };
}
function renderPlayerHeatmapCanvas(player, index){
  return `<canvas class="finalHeatmapCanvas" width="${finalHeatmapFieldMap.width}" height="${finalHeatmapFieldMap.height}" data-heatmap-player="${index}" data-heatmap-name="${escapeHtml(player.name)}" aria-label="${escapeHtml(player.name)} heatmap"></canvas>`;
}

function finalHeatmapGridStyle(count){

}

function finalPointInPolygon(point, polygon){
  let inside = false;
  for(let i = 0, j = polygon.length - 1; i < polygon.length; j = i++){
    const pi = polygon[i], pj = polygon[j];
    const intersects = ((pi.y > point.y) !== (pj.y > point.y)) &&
      (point.x < (pj.x - pi.x) * (point.y - pi.y) / ((pj.y - pi.y) || 1e-9) + pi.x);
    if(intersects) inside = !inside;
  }
  return inside;
}
function finalPointInField(point){
  const mainFieldPoly = [
    {x:9.2,y:14.8},{x:17.5,y:1.9},{x:82.5,y:1.9},{x:90.8,y:14.8},
    {x:90.8,y:85.3},{x:82.5,y:98.1},{x:17.5,y:98.1},{x:9.2,y:85.3}
  ];
  return finalPointInPolygon(point, mainFieldPoly) ||
    (point.x >= 0 && point.x <= 9.2 && point.y >= 41.3 && point.y <= 58.3) ||
    (point.x >= 90.8 && point.x <= 100 && point.y >= 41.3 && point.y <= 58.3);
}
function finalPositioningDisplayPercent(sample){
  return finalInsetMapPercent(finalFieldCoordToMapPercent(sample.x, sample.y));
}
function finalRoundedRect(ctx, x, y, w, h, r){
  if(ctx.roundRect){
    ctx.beginPath();
    ctx.roundRect(x,y,w,h,r);
    ctx.fill();
    return;
  }
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.fill();
}
function drawFinalHeatmapCanvas(canvas, player){
  if(!canvas || !player?.samples?.length) return;
  if(canvas.dataset.drawn === "1") return;
  const ctx = canvas.getContext("2d");
  if(!ctx) return;
  const gridW = 170;
  const gridH = 112;
  const density = new Float32Array(gridW * gridH);
  const addCell = (gx, gy, weight)=>{
    if(gx < 0 || gx >= gridW || gy < 0 || gy >= gridH) return;
    density[gy * gridW + gx] += weight;
  };
  const addHeatKernel = (gx, gy, weight=1)=>{
    const radius = 1;
    const sigma = .6;
    const twoSigmaSquared = 2 * sigma * sigma;
    for(let oy=-radius; oy<=radius; oy++){
      for(let ox=-radius; ox<=radius; ox++){
        const d2 = ox * ox + oy * oy;
        if(d2 > radius * radius) continue;
        addCell(gx + ox, gy + oy, weight * Math.exp(-d2 / twoSigmaSquared));
      }
    }
  };
  const addSamplePoint = (sample, weight=1)=>{
    const pos = finalPositioningDisplayPercent(sample);
    if(!finalPointInField(pos)) return;
    const gx = Math.round((pos.x / 100) * (gridW - 1));
    const gy = Math.round((pos.y / 100) * (gridH - 1));
    addHeatKernel(gx, gy, weight);
  };
  const samples = [...player.samples].sort((a,b)=>(a.elapsed ?? 0) - (b.elapsed ?? 0));
  let previous = null;
  samples.forEach(sample=>{
    addSamplePoint(sample, 1);
    if(previous && Number.isFinite(sample.elapsed) && Number.isFinite(previous.elapsed) && sample.elapsed - previous.elapsed <= .55){
      const aPos = finalPositioningDisplayPercent(previous);
      const bPos = finalPositioningDisplayPercent(sample);
      const cellDistance = Math.hypot((bPos.x - aPos.x) / 100 * gridW, (bPos.y - aPos.y) / 100 * gridH);
      const steps = Math.min(5, Math.max(0, Math.ceil(cellDistance / 1.9) - 1));
      for(let i=1; i<=steps; i++){
        const t = i / (steps + 1);
        addSamplePoint({
          x:previous.x + (sample.x - previous.x) * t,
          y:previous.y + (sample.y - previous.y) * t
        }, .135);
      }
    }
    previous = sample;
  });
  const trendDensity = new Float32Array(density.length);
  for(let gy=0; gy<gridH; gy++){
    for(let gx=0; gx<gridW; gx++){
      const index = gy * gridW + gx;
      const raw = density[index];
      if(raw <= 0) continue;
      let neighborTotal = 0;
      let neighborWeight = 0;
      const radius = 4;
      const sigma = 1.82 - .38 * .45;
      const twoSigmaSquared = 2 * sigma * sigma;
      for(let oy=-radius; oy<=radius; oy++){
        for(let ox=-radius; ox<=radius; ox++){
          const distanceSquared = ox * ox + oy * oy;
          if(distanceSquared > radius * radius) continue;
          const nx = gx + ox;
          const ny = gy + oy;
          if(nx < 0 || nx >= gridW || ny < 0 || ny >= gridH) continue;
          const weight = Math.exp(-distanceSquared / twoSigmaSquared);
          neighborTotal += density[ny * gridW + nx] * weight;
          neighborWeight += weight;
        }
      }
      const neighborAverage = neighborWeight ? neighborTotal / neighborWeight : raw;
      const repeatMass = Math.max(0, neighborTotal - raw);
      trendDensity[index] = (raw * (.72 + .38 * .18)) + (neighborAverage * (.74 - .38 * .24)) + (repeatMass * (.025 - .38 * .012));
    }
  }
  const positiveTrends = Array.from(trendDensity).filter(value=>value > 0).sort((a,b)=>a-b);
  const trendPercentile = pct=>{
    if(!positiveTrends.length) return FINAL_HEAT_BASE_SCALE;
    const index = Math.max(0, Math.min(positiveTrends.length - 1, Math.round((positiveTrends.length - 1) * pct)));
    return positiveTrends[index];
  };
  const coverageRatio = positiveTrends.length / Math.max(1, gridW * gridH);
  const coverageBlend = clampValue((coverageRatio - .50) / .18, 0, 1);
  const repeatScale = Math.max(FINAL_HEAT_BASE_SCALE, trendPercentile(.93) * .92, trendPercentile(.982) * .58);
  const heatScale = clampValue(repeatScale * (1 + coverageBlend * .14), FINAL_HEAT_BASE_SCALE, FINAL_HEAT_SCALE_MAX);
  const heatCurvePower = .88 + coverageBlend * .16;
  const activityNoiseFloor = trendPercentile(.16) * coverageBlend * .78;
  const colourFor = value=>{
    if(value <= 0) return null;
    const alpha = (.60 + Math.min(1, value) * .37).toFixed(2);
    if(value < .24) return `rgba(65,108,198,${alpha})`;
    if(value < .52) return `rgba(65,210,135,${alpha})`;
    if(value < .76) return `rgba(255,208,0,${alpha})`;
    if(value < .92) return `rgba(240,150,28,${alpha})`;
    return `rgba(255,56,56,${alpha})`;
  };
  const cellW = canvas.width / gridW;
  const cellH = canvas.height / gridH;
  const pad = Math.max(.9, Math.min(cellW, cellH) * .14);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let gy=0; gy<gridH; gy++){
    for(let gx=0; gx<gridW; gx++){
      const raw = density[gy * gridW + gx];
      if(raw <= 0) continue;
      const px = (gx / Math.max(1, gridW - 1)) * 100;
      const py = (gy / Math.max(1, gridH - 1)) * 100;
      if(!finalPointInField({x:px,y:py})) continue;
      const trend = trendDensity[gy * gridW + gx] || raw;
      const effectiveTrend = trend - activityNoiseFloor;
      if(effectiveTrend <= 0) continue;
      const v = Math.min(1, Math.pow(effectiveTrend / Math.max(1, heatScale - activityNoiseFloor), heatCurvePower));
      const color = colourFor(v);
      if(!color) continue;
      ctx.fillStyle = color;
      finalRoundedRect(ctx, gx * cellW + pad, gy * cellH + pad, cellW - pad * 2, cellH - pad * 2, Math.min(4, cellW * .24));
    }
  }
  canvas.dataset.drawn = "1";
}
function drawFinalHeatmapCanvases(){
  const heatmap = state.replayHeatmap;

function stingerExtension(config){
  const source = String(config?.stingerTransitionName || config?.stingerTransitionUrl || "").split("?")[0].toLowerCase();
  const match = source.match(/\.([a-z0-9]+)$/);
  return match ? `.${match[1]}` : "";
}

function stingerBrowserPlayable(config){
  const ext = stingerExtension(config);
  if(!ext) return true;
  if([".avi",".mkv",".flv",".ts"].includes(ext)) return false;
  const mimeByExt = {
    ".webm":"video/webm",
    ".mp4":"video/mp4",
    ".m4v":"video/mp4",
    ".mov":"video/quicktime",
    ".gif":"image/gif"
  };
  const mime = mimeByExt[ext];
  if(!mime) return true;
  const probe = document.createElement("video");
  return ext === ".gif" || !!probe.canPlayType(mime);
}

function triggerFinalFade(stage){
  if(!stage) return;
  stage.classList.remove("fadeTransition");
  void stage.offsetWidth;
  stage.classList.add("fadeTransition");
}

function transitionCutDelayMs(config, hasPlayableStinger){
  if(!hasPlayableStinger) return 0;
  const n = Number(config?.stingerTransitionCutMs);
  return Number.isFinite(n) ? Math.max(0, Math.min(5000, Math.round(n))) : 900;
}

function revealFinalScreen(){
  if(personalOverlayMode) return;
  if(state.finalVisible) return;
  state.finalVisible = true;
  if(!forceLiveStatsScreen) scheduleRecentReplayHeatmap();
  render();

function preloadFinalTransition(config){
  const stinger = $("stingerTransition");
  const src = String(config?.stingerTransitionUrl || "");
  if(!stinger || !src || !stingerBrowserPlayable(config)) return false;
  if(stinger.getAttribute("src") !== src) stinger.src = src;
  stinger.muted = true;
  stinger.playsInline = true;
  stinger.preload = "auto";
  try{ stinger.load?.(); }catch{}
  return true;
}

function cancelFinalTransition(){
  if(finalTransitionQueueTimer){
    clearTimeout(finalTransitionQueueTimer);
    finalTransitionQueueTimer = null;
  }
  if(finalTransitionTimer){
    clearTimeout(finalTransitionTimer);
    finalTransitionTimer = null;
  }
  if(stingerTimer){
    clearTimeout(stingerTimer);
    stingerTimer = null;
  }
  if(stingerFallbackTimer){
    clearTimeout(stingerFallbackTimer);
    stingerFallbackTimer = null;
  }
  finalTransitionRunId += 1;
  const stinger = $("stingerTransition");
  stinger?.classList.remove("active");
  try{ stinger?.pause(); }catch{}
}

function applyForceLiveOverlayCommand(config){
  const commandAt = Number(config?.forceLiveOverlayAt) || 0;
  if(!commandAt || commandAt <= forceLiveOverlayAt) return forceLiveOverlayActive;
  forceLiveOverlayAt = commandAt;
  if(Date.now() - commandAt > forceLiveCommandWindowMs) return forceLiveOverlayActive;
  forceLiveOverlayActive = true;
  state.finalVisible = false;
  state.heatmapVisible = false;
  state.replayHeatmap = null;
  state.finalExitTransitioning = false;
  replayHeatmapRunId += 1;
  cancelFinalTransition();
  $("finalScreen")?.classList.remove("heatmapActive");
  return true;
}

function queueFinalTransition(config){
  if(personalOverlayMode) return;
  if(forceLiveStatsScreen) return;
  if(applyForceLiveOverlayCommand(config)) return;
  if(state.finalVisible || finalTransitionQueueTimer || finalTransitionTimer) return;
  preloadFinalTransition(config);
  finalTransitionQueueTimer = setTimeout(()=>{
    finalTransitionQueueTimer = null;
    if(!state.matchEnded || state.finalVisible) return;
    playFinalTransition(readConfig());
  }, 2500);
}

function scheduleRecentReplayHeatmap(){
  if(personalOverlayMode || forceFinalPreview) return;
  if(replayHeatmapLookupTimer) clearTimeout(replayHeatmapLookupTimer);
  if(replayHeatmapRevealTimer) clearTimeout(replayHeatmapRevealTimer);
  state.heatmapVisible = false;
  state.replayHeatmap = null;
  const runId = ++replayHeatmapRunId;
  let report = null;
  let lookupComplete = false;
  let revealWindowOpen = false;
  const scheduledAt = Date.now();
  const matchEndedAt = Number(state.matchEndedAt) || Date.now();
  const minModifiedMs = Math.max(0, matchEndedAt - 15000);
  const revealDelayMs = 15000;
  const lookupStartDelayMs = 9000;
  const lookupRetryMs = 1500;
  const lookupDeadlineMs = scheduledAt + revealDelayMs;
  const revealIfReady = ()=>{
    if(runId !== replayHeatmapRunId || !state.matchEnded || !state.finalVisible) return;
    if(!revealWindowOpen || !lookupComplete || !report?.players?.length) return;
    state.replayHeatmap = report;
    state.heatmapVisible = true;
    render();
  };
  const scheduleLookupAttempt = delay=>{
    if(replayHeatmapLookupTimer) clearTimeout(replayHeatmapLookupTimer);
    replayHeatmapLookupTimer = setTimeout(loadRecentReplayHeatmap, Math.max(0, delay));
  };
  const loadRecentReplayHeatmap = async()=>{
    replayHeatmapLookupTimer = null;
    if(runId !== replayHeatmapRunId || !state.matchEnded || !state.finalVisible) return;
    try{
      const params = new URLSearchParams({
        maxAgeMs:"120000",
        minModifiedMs:String(minModifiedMs),
        minStableMs:"1500",
        t:String(Date.now())
      });
      const response = await fetch(`${location.origin}/api/latest-replay/analyze?${params}`, {cache:"no-store"});
      const json = await response.json().catch(()=>null);
      if(!response.ok || !json?.ok || !json?.analysis){
        if(Date.now() + lookupRetryMs <= lookupDeadlineMs){
          scheduleLookupAttempt(lookupRetryMs);
          return;
        }
        return;
      }
      report = buildReplayHeatmapFromAnalysis({...json.analysis, replayFile:json.replay});
    }catch(error){
      console.warn("Could not load recent replay heatmap:", error);
      if(Date.now() + lookupRetryMs <= lookupDeadlineMs){
        scheduleLookupAttempt(lookupRetryMs);
        return;
      }
    }finally{
      if(!replayHeatmapLookupTimer) lookupComplete = true;
      revealIfReady();
    }
  };
  scheduleLookupAttempt(lookupStartDelayMs);
  replayHeatmapRevealTimer = setTimeout(()=>{
    replayHeatmapRevealTimer = null;
    revealWindowOpen = true;
    revealIfReady();
  }, revealDelayMs);
}

function unlockLiveStatsIfFocused(focusName){
  const clean = cleanName(focusName);
  if(!clean) return;
  const hasPlayer = Array.from(state.players.keys()).some(name=>cleanName(name).toLowerCase() === clean.toLowerCase());
  if(hasPlayer) state.liveStatsUnlocked = true;
}

function beginNextMatchResetTransition(){
  if(state.finalExitTransitioning) return true;
  if(!state.finalVisible || personalOverlayMode){
    resetForNextMatch();
    return false;
  }
  state.finalExitTransitioning = true;
  playFinalTransition(readConfig(), ()=>{
    resetForNextMatch({preserveActiveTransition:true});
    render();
  });
  return true;
}

function playFinalTransition(config, onCut=revealFinalScreen){
  const stage = $("stage");
  const stinger = $("stingerTransition");
  const src = String(config.stingerTransitionUrl || "");
  const runId = ++finalTransitionRunId;
  stage?.classList.remove("fadeTransition");
  if(finalTransitionTimer){
    clearTimeout(finalTransitionTimer);
    finalTransitionTimer = null;
  }
  if(stingerTimer){
    clearTimeout(stingerTimer);
    stingerTimer = null;
  }
  if(stingerFallbackTimer){
    clearTimeout(stingerFallbackTimer);
    stingerFallbackTimer = null;
  }
  if(!stinger){
    onCut?.();
    return;
  }
  stinger.classList.remove("active");
  stinger.onended = null;
  stinger.oncanplay = null;
  stinger.onloadstart = null;
  stinger.onloadeddata = null;
  stinger.oncanplaythrough = null;
  stinger.onerror = null;
  try{ stinger.pause(); }catch{}
  const playableStinger = !!src && stingerBrowserPlayable(config);
  let cutDone = false;
  const cut = ()=>{
    if(runId !== finalTransitionRunId || cutDone) return;
    cutDone = true;
    if(finalTransitionTimer){
      clearTimeout(finalTransitionTimer);
      finalTransitionTimer = null;
    }
    onCut?.();
  };
  if(!playableStinger){
    stinger.removeAttribute("src");
    triggerFinalFade(stage);
    cut();
    return;
  }
  if(stinger.getAttribute("src") !== src) stinger.src = src;
  stinger.muted = true;
  stinger.playsInline = true;
  stinger.preload = "auto";
  stinger.classList.add("active");
  let started = false;
  const cleanup = ()=>{
    if(runId !== finalTransitionRunId) return;
    if(stingerTimer){
      clearTimeout(stingerTimer);
      stingerTimer = null;
    }
    if(stingerFallbackTimer){
      clearTimeout(stingerFallbackTimer);
      stingerFallbackTimer = null;
    }
    stinger.classList.remove("active");
    try{ stinger.pause(); }catch{}
    cut();
  };
  stinger.onended = cleanup;
  stinger.onerror = ()=>{
    cleanup();
    triggerFinalFade(stage);
  };
  let playRetries = 0;
  const armPlaybackTimers = ()=>{
    if(runId !== finalTransitionRunId || finalTransitionTimer) return;
    finalTransitionTimer = setTimeout(cut, transitionCutDelayMs(config, true));
    stingerTimer = setTimeout(cleanup, Math.max(4500, transitionCutDelayMs(config, true) + 1500));
  };
  const start = ()=>{
    if(runId !== finalTransitionRunId || started) return;
    started = true;
    try{ stinger.currentTime = 0; }catch{}
    const played = stinger.play?.();
    if(played?.then){
      played.then(armPlaybackTimers).catch(error=>{
        if(runId !== finalTransitionRunId) return;
        const message = String(error?.name || error?.message || error || "");
        if(playRetries < 2 && /abort|interrupted|load/i.test(message)){
          playRetries += 1;
          started = false;
          setTimeout(start, 120);
          return;
        }
        console.warn("Could not play stinger transition:", error);
        cleanup();
        triggerFinalFade(stage);
      });
      return;
    }
    if(played?.catch) played.catch(error=>{
      if(runId !== finalTransitionRunId) return;
      console.warn("Could not play stinger transition:", error);
      cleanup();
      triggerFinalFade(stage);
    });
    armPlaybackTimers();
  };
  if(stinger.readyState >= 2) start();
  else{
    stinger.onloadeddata = start;
    stinger.oncanplay = start;
    stinger.oncanplaythrough = start;
  }
  if(stinger.readyState < 2){
    try{ stinger.load?.(); }catch{}
  }
  stingerFallbackTimer = setTimeout(()=>{
    if(runId !== finalTransitionRunId || started) return;
    if(stinger.readyState >= 2){
      start();
    }else{
      cleanup();
      triggerFinalFade(stage);
    }
  }, 2500);
}
function render(){
  const config = readConfig();
  applyForceLiveOverlayCommand(config);
  if(forceLiveStatsScreen && !personalOverlayMode){
    state.finalVisible = true;
    state.heatmapVisible = false;
  }
  applyOverlayTheme(config);
  const stage = $("stage");
  stage.classList.toggle("live", state.connected && state.updates > 0);
  stage.classList.toggle("personalOverlay", personalOverlayMode);
  stage.classList.toggle("replayActive", !!state.replay);
  stage.classList.toggle("finalActive", !!state.finalVisible && !personalOverlayMode);
  stage.classList.toggle("liveStatsUnlocked", !!state.liveStatsUnlocked);
  stage.classList.toggle("overtime", !!state.overtime);
  const tournamentLogo = $("tournamentLogo");
  const hasTournamentLogo = !!String(config.tournamentLogoUrl || "").trim();
  stage.classList.toggle("hasTournamentLogo", hasTournamentLogo);
  if(tournamentLogo && hasTournamentLogo){
    if(tournamentLogo.src !== config.tournamentLogoUrl) tournamentLogo.src = config.tournamentLogoUrl;
    tournamentLogo.style.setProperty("--logo-x", `${Math.max(0, Math.min(1920, Number(config.tournamentLogoX) || 0))}px`);
    tournamentLogo.style.setProperty("--logo-y", `${Math.max(0, Math.min(1080, Number(config.tournamentLogoY) || 0))}px`);
    tournamentLogo.style.setProperty("--logo-w", `${Math.max(24, Math.min(900, Number(config.tournamentLogoWidth) || 280))}px`);
  }
  $("blueName").textContent = config.blueTeamName || state.teams.Blue.name || "Blue";
  $("orangeName").textContent = config.orangeTeamName || state.teams.Orange.name || "Orange";
  const blueLogo = teamLogoFor("Blue", config);
  const orangeLogo = teamLogoFor("Orange", config);
  $("blueLogo").classList.toggle("empty", !blueLogo);
  $("orangeLogo").classList.toggle("empty", !orangeLogo);
  $("blueLogo").src = blueLogo || "";
  $("orangeLogo").src = orangeLogo || "";
  $("blueScore").textContent = scoreText(state.teams.Blue.score);
  $("orangeScore").textContent = scoreText(state.teams.Orange.score);
  $("clock").textContent = overlayClockText();
  $("matchTag").textContent = state.updates ? `${overlayGameLabel(config)}     Best of ${Number(config.seriesBestOf) || 5}` : "Waiting for feed";
  $("blueSeries").innerHTML = renderDots("Blue", config);
  $("orangeSeries").innerHTML = renderDots("Orange", config);
  renderBoostRowsInto("blueBoosts", "Blue");
  renderBoostRowsInto("orangeBoosts", "Orange");
  renderReplayBanner();
  renderCustomScoreboard(config);
  renderLiveStatCard();
  const finalScreen = $("finalScreen");
  if(finalScreen) finalScreen.classList.toggle("active", !!state.finalVisible && !personalOverlayMode);
  if(state.finalVisible && !personalOverlayMode) renderFinalScreen(config);
}
function handleMessage(raw){
  let msg;
  try{msg = normalizeMessage(raw);}catch{return;}
  if(compactEventName(msg.event).includes("sparkoverlayconfig")){
    applyConfigBroadcast(msg.payload);
    return;
  }
  state.connected = true;
  state.updates++;
  const eventName = compactEventName(msg.event);
  const incomingMatchGuid = matchGuidFromPayload(msg.payload);
  if(incomingMatchGuid) state.matchGuid = incomingMatchGuid;
  const incomingClockState = gameClockState(msg.payload);
  const incomingClock = incomingClockState.clock;
  const messageEndsMatch = matchEndedFlag(msg.payload, msg.event);
  if(nextMatchLooksReady(msg.payload, eventName, incomingClock, messageEndsMatch) && beginNextMatchResetTransition()) return;
  const firstMatchEnd = messageEndsMatch && !state.matchEnded;
  if(messageEndsMatch){
    state.replay = false;
    if(firstMatchEnd) state.matchEndedAt = Date.now();
    state.matchEnded = true;
  }
  updateTeams(msg.payload);
  updatePlayers(msg.payload);
  const focusName = focusNameFromPayload(msg.payload);
  if(focusName){
    state.focusedPlayerName = focusName;
    unlockLiveStatsIfFocused(focusName);
  }
  if(state.matchEnded && !messageEndsMatch && nextMatchStartEvent(eventName)){
    if(beginNextMatchResetTransition()) return;
  }
  if(eventName.includes("goalscored")){
    updateGoalReplayInfo({...goalReplayInfoFromPayload(msg.payload), newGoal:true});
  }
  if(eventName.includes("ballhit")){
    const eventPlayers = extractPlayers(msg.payload);
    const primaryHitPlayer = eventPlayers[0] || null;
    const hitPlayer = playerNameFromValue(firstDefined(primaryHitPlayer, valueByKey(msg.payload,["Player","player","playerName","PlayerName","lastTouchPlayer","LastTouchPlayer"]), msg.payload?.BallLastTouch?.Player, msg.payload?.ballLastTouch?.player));
    const team = normalizeTeam(firstDefined(valueByKey(primaryHitPlayer,["TeamNum","teamNum","team","Team"]), valueByKey(msg.payload,["team","Team"])));
    const p = ensurePlayer(hitPlayer, team);
    if(p){
      p.stats.touches = (p.stats.touches || 0) + 1;
    }
  }
  if(eventName.includes("statfeed")){
    const statTarget = firstDefined(msg.payload?.MainTarget, msg.payload?.mainTarget, msg.payload?.Player, msg.payload?.player);
    const statPlayer = playerNameFromValue(statTarget);
    const statType = String(firstDefined(valueByKey(msg.payload,["Type","type","EventName","eventName"]), "")).toLowerCase();
    const team = normalizeTeam(firstDefined(valueByKey(statTarget,["TeamNum","teamNum","team","Team"]), valueByKey(msg.payload,["team","Team"])));
    const p = ensurePlayer(statPlayer, team);
    if(p){
      if(statType.includes("goal")){
        p.stats.goals = (p.stats.goals || 0) + 1;
        updateGoalReplayInfo({scorer:statPlayer, team});
      }
      if(statType.includes("shot")) p.stats.shots = (p.stats.shots || 0) + 1;
      if(statType.includes("assist")){
        p.stats.assists = (p.stats.assists || 0) + 1;
        updateGoalReplayInfo({assist:statPlayer, team});
      }
      if(statType.includes("save")) p.stats.saves = (p.stats.saves || 0) + 1;
      if(statType.includes("demo")) p.stats.demos = (p.stats.demos || 0) + 1;
    }
  }
  const clock = incomingClock;
  if(clock !== null){
    state.clock = clock;
  }
  if(clock !== null || incomingClockState.overtime){
    const wasOvertime = !!state.overtime;
    state.overtime = !!incomingClockState.overtime;
    if(state.overtime){
      if(incomingClockState.overtimeSecondsKnown || incomingClockState.clock !== null || !wasOvertime){
        state.overtimeSeconds = Number(incomingClockState.overtimeSeconds) || 0;
        state.overtimeUpdatedAt = Date.now();
      }
    }else{
      state.overtimeSeconds = 0;
      state.overtimeUpdatedAt = null;
    }
  }
  const replay = replayFlag(msg.payload);
  if(replay !== null) state.replay = replay;
  if(eventName.includes("goalreplay")) state.replay = !(eventName.includes("ended") || eventName.endsWith("end") || eventName.includes("willend"));
  if(messageEndsMatch && !personalOverlayMode){
    const config = readConfig();
    queueFinalTransition(config);
  }
  render();
}
function updateStageScale(){
  const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.documentElement.style.setProperty("--stage-scale", String(scale || 1));
}
function connect(){
  const wsUrl = `${location.origin.replace(/^http/, "ws")}/api/live-api`;
  const ws = new WebSocket(wsUrl);
  ws.addEventListener("open", ()=>{state.connected = true; render();});
  ws.addEventListener("message", event=>handleMessage(event.data));
  ws.addEventListener("close", ()=>{
    state.connected = false;
    render();
    setTimeout(connect, 1500);
  });
  ws.addEventListener("error", ()=>{state.connected = false; render();});
}
function startHeartbeat(){
  const id = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  const endpoint = `${location.origin}/api/spark-heartbeat`;
  function post(closing=false){
    const payload = JSON.stringify({id, closing, path:location.pathname, overlay:true});
    if(closing && navigator.sendBeacon){
      navigator.sendBeacon(endpoint, new Blob([payload], {type:"application/json"}));
      return;
    }
    fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:payload,cache:"no-store"}).catch(()=>{});
  }
  post(false);
  const timer = setInterval(()=>post(false), 15000);
  window.addEventListener("pagehide", ()=>{clearInterval(timer); post(true);});
}
function seedFinalPreview(){
  state.connected = true;
  state.updates = 1;
  state.matchEnded = true;
  state.matchEndedAt = Date.now();
  state.clock = 0;
  state.teams.Blue = {name:"1NE",score:4};
  state.teams.Orange = {name:"BDG",score:2};
  [
    {name:"Volt",team:"Blue",score:612,goals:2,shots:5,assists:1,saves:2,demos:1,boost:46},
    {name:"Surge",team:"Blue",score:488,goals:1,shots:4,assists:2,saves:1,demos:0,boost:41},
    {name:"Arc",team:"Blue",score:344,goals:1,shots:3,assists:0,saves:3,demos:2,boost:38},
    {name:"Rival 1",team:"Orange",score:521,goals:1,shots:4,assists:1,saves:4,demos:0,boost:33},
    {name:"Rival 2",team:"Orange",score:402,goals:1,shots:3,assists:0,saves:2,demos:1,boost:29},
    {name:"Rival 3",team:"Orange",score:276,goals:0,shots:2,assists:1,saves:1,demos:0,boost:35}
  ].forEach(raw=>{
    const player = ensurePlayer(raw.name, raw.team);
    if(!player) return;
    player.stats.score = raw.score;
    player.stats.goals = raw.goals;
    player.stats.shots = raw.shots;
    player.stats.assists = raw.assists;
    player.stats.saves = raw.saves;
    player.stats.demos = raw.demos;
    player.boost = raw.boost;
    player.boostKnown = true;
  });
}
window.addEventListener("resize", updateStageScale);
window.addEventListener("storage", event=>{
  if(event.key === overlayConfigKey) render();
});
updateStageScale();
refreshServerConfig().finally(()=>{
  setInterval(refreshServerConfig, 2000);
  startHeartbeat();
  if(forceFinalPreview){
    seedFinalPreview();
    queueFinalTransition(readConfig());
  }else{
    connect();
    render();
  }
});
</script>
